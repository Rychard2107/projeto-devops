---
- name: Servidor de aplicação
  hosts: servidor_app
  become: true
  tasks:
    - name: Instalar o Apache
      ansible.builtin.apt:
        name: apache2
    - name: Substituir a página padrão
      ansible.builtin.template:
        src: index.html.j2
        dest: /var/www/html/index.html
        mode: "0644"
    - name: Habilitar o Apache
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true
