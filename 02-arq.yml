---
- name: Configurar o servidor de arquivos (arq)
  hosts: servidor_arquivos
  become: true
  tasks:
    # ---------- LVM ----------
    - name: Instalar o LVM
      ansible.builtin.apt:
        name: lvm2

    - name: Criar o VG dados com os 3 discos
      community.general.lvg:
        vg: "{{ lvm_vg }}"
        pvs: "{{ lvm_discos }}"

    - name: Criar o LV ifpb de 15 GB
      community.general.lvol:
        vg: "{{ lvm_vg }}"
        lv: "{{ lvm_lv }}"
        size: "{{ lvm_tamanho }}"

    - name: Formatar o LV em ext4
      community.general.filesystem:
        fstype: ext4
        dev: "/dev/{{ lvm_vg }}/{{ lvm_lv }}"

    - name: Montar em /dados (fstab)
      ansible.posix.mount:
        path: "{{ lvm_ponto_montagem }}"
        src: "/dev/{{ lvm_vg }}/{{ lvm_lv }}"
        fstype: ext4
        opts: defaults
        state: mounted

    # ---------- NFS ----------
    - name: Grupo do usuário NFS
      ansible.builtin.group:
        name: "{{ nfs_usuario }}"
        gid: "{{ nfs_gid }}"

    - name: Usuário nfs-ifpb sem shell
      ansible.builtin.user:
        name: "{{ nfs_usuario }}"
        uid: "{{ nfs_uid }}"
        group: "{{ nfs_usuario }}"
        shell: /usr/sbin/nologin
        create_home: false

    - name: Instalar o servidor NFS
      ansible.builtin.apt:
        name: nfs-kernel-server

    - name: Diretório compartilhado (escrita só para nfs-ifpb)
      ansible.builtin.file:
        path: "{{ nfs_diretorio }}"
        state: directory
        owner: "{{ nfs_usuario }}"
        group: "{{ nfs_usuario }}"
        mode: "0755"

    - name: Configurar /etc/exports
      ansible.builtin.template:
        src: exports.j2
        dest: /etc/exports
        mode: "0644"
      notify: Reexportar NFS

    - name: Habilitar o NFS
      ansible.builtin.service:
        name: nfs-kernel-server
        state: started
        enabled: true

    # ---------- DHCP (configs antes do pacote, senão a instalação falha) ----------
    - name: Interface do DHCP
      ansible.builtin.copy:
        content: |
          INTERFACESv4="{{ interface_privada }}"
          INTERFACESv6=""
        dest: /etc/default/isc-dhcp-server
        mode: "0644"
      notify: Reiniciar DHCP

    - name: dhcpd.conf autoritativo
      ansible.builtin.template:
        src: dhcpd.conf.j2
        dest: /etc/dhcp/dhcpd.conf
        mode: "0644"
      notify: Reiniciar DHCP

    - name: Instalar o isc-dhcp-server
      ansible.builtin.apt:
        name: isc-dhcp-server

    - name: Habilitar o DHCP
      ansible.builtin.service:
        name: isc-dhcp-server
        state: started
        enabled: true

    # ---------- DNS ----------
    - name: Instalar o BIND9
      ansible.builtin.apt:
        name: [bind9, bind9-utils, bind9-dnsutils]

    - name: Opções do BIND
      ansible.builtin.template:
        src: named.conf.options.j2
        dest: /etc/bind/named.conf.options
        owner: root
        group: bind
        mode: "0644"
      notify: Reiniciar BIND

    - name: Declarar as zonas
      ansible.builtin.template:
        src: named.conf.local.j2
        dest: /etc/bind/named.conf.local
        owner: root
        group: bind
        mode: "0644"
      notify: Reiniciar BIND

    - name: Zona direta
      ansible.builtin.template:
        src: zona-direta.j2
        dest: "/etc/bind/db.{{ dominio }}"
        owner: root
        group: bind
        mode: "0644"
      notify: Reiniciar BIND

    - name: Zona reversa
      ansible.builtin.template:
        src: zona-reversa.j2
        dest: /etc/bind/db.192.168.56
        owner: root
        group: bind
        mode: "0644"
      notify: Reiniciar BIND

    - name: Validar configuração e zonas
      ansible.builtin.shell: |
        named-checkconf &&
        named-checkzone {{ dominio }} /etc/bind/db.{{ dominio }} &&
        named-checkzone 56.168.192.in-addr.arpa /etc/bind/db.192.168.56
      changed_when: false

    - name: Habilitar o BIND
      ansible.builtin.service:
        name: named
        state: started
        enabled: true

  handlers:
    - name: Reexportar NFS
      ansible.builtin.command: exportfs -ra
    - name: Reiniciar DHCP
      ansible.builtin.service:
        name: isc-dhcp-server
        state: restarted
    - name: Reiniciar BIND
      ansible.builtin.service:
        name: named
        state: restarted
